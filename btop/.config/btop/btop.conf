#? btop mini: CPU and memory only, Catppuccin Mocha. Opened as a tmux popup (prefix + B).
#? Settings not listed here use btop's defaults.
color_theme = "catppuccin_mocha"
theme_background = False
truecolor = True
shown_boxes = "cpu mem"
update_ms = 1000
show_disks = False
mem_graphs = True
show_battery = False
#? Keep this file as written (btop would otherwise rewrite it on exit)
save_config_on_exit = False
