# Based on Dreams of Code, "Tmux has forever changed the way I write code"
# https://github.com/dreamsofcode-io/dotfiles

set-option -sa terminal-overrides ",xterm*:Tc"

# Claude Code: let alerts reach Windows, and tell Shift+Enter apart from Enter
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g mouse on

# MX Master thumb wheel moves the divider of the pane under the mouse
# (Windows Terminal sends thumb-left as mouse button 7, thumb-right as button 6)
bind -n MouseDown7Pane resize-pane -t = -L 4
bind -n MouseDown6Pane resize-pane -t = -R 4

# Prefix: default Ctrl-b. Caps Lock sends Ctrl-b via AutoHotkey (Windows Terminal only),
# which frees Ctrl-Space for Todoist.
set -g prefix C-b
bind C-b send-prefix

# Reload config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Alt-arrow keys switch panes without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift-arrow switches windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift-Alt vim keys switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Theme: Catppuccin Mocha, status bar on top (style from github.com/omerxx/dotfiles)
set -g status-position top
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory date_time host"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
# CPU and RAM in the bar, reusing the theme's date_time slot
set -g @catppuccin_date_time_icon ""
set -g @catppuccin_date_time_color "#89b4fa"
set -g @catppuccin_date_time_text "#(~/.config/tmux/scripts/sysinfo.sh)"
# Claude usage limits (5-hour and 7-day) in their own bubble, in Claude's orange, reusing the theme's host slot
set -g @catppuccin_host_icon "✻"
set -g @catppuccin_host_color "#d97757"
set -g @catppuccin_host_text "#(~/.config/tmux/scripts/claude-limits.sh)"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # keep last: its autosave rides on status-right

# Restore the workspace after a shutdown: continuum saves every 15 min and
# restores when tmux starts. Manual: prefix + Ctrl-s save, prefix + Ctrl-r restore.
set -g @continuum-restore 'on'
# When a session closes (restore replaces the empty start-up one), move to another session instead of leaving tmux
set -g detach-on-destroy off
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
# Claude panes come back in their own conversation; nvim with its last session
set -g @resurrect-processes '"~claude" "~nvim->nvim-restore" btop'
set -g @resurrect-hook-post-save-layout 'python3 ~/.config/tmux/scripts/resurrect-claude.py'

run '~/.config/tmux/plugins/tpm/tpm'

# After the theme: shaded status bar and omerxx's pane borders (the theme overrides both)
run-shell '~/.config/tmux/scripts/shade-status.sh'
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Vi copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# New splits and windows open in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Prefix + F: split right and fork the most recent Claude session in this pane's directory
bind F split-window -h -c "#{pane_current_path}" "claude --continue --fork-session"

# Prefix + B: mini btop (CPU and memory) in a popup; q closes it
bind B display-popup -E -w 70% -h 60% -T " btop " btop
