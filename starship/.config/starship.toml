add_newline = false
format = "$directory$git_branch$git_status$python$cmd_duration$line_break$character"

[directory]
truncation_length = 3

[git_branch]
format = "[$branch]($style) "

[git_status]
format = "[$all_status$ahead_behind]($style) "

[python]
format = "[($virtualenv)]($style) "

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
